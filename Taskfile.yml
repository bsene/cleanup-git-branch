version: '3'

vars:
  BINARY: cleanup-git-branch

tasks:
  build:
    desc: Build the binary
    cmds:
      - go build -o {{.BINARY}} ./cmd/cleanup-git-branch

  test:
    desc: Run all tests with race detection
    cmds:
      - go test -race ./...

  lint:
    desc: Run Go vet as the baseline linter
    cmds:
      - go vet ./...

  mutate:
    desc: Run mutation testing with a 100% kill threshold
    cmds:
      - |
        set -e
        for pkg in ./internal/config ./internal/cleaner; do
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 \
            unleash "$pkg" \
            --timeout-coefficient 20 --workers 1 --test-cpu 1 \
            --threshold-efficacy 100
        done

  smoke:
    desc: Run smoke tests under scripts/smoke
    cmds:
      - |
        set -e
        for script in scripts/smoke/*.sh; do
          echo "Running $script..."
          bash "$script"
        done

  verify:
    desc: Run lint, test, mutation testing, and smoke tests
    cmds:
      - task: lint
      - task: test
      - task: mutate
      - task: build
      - task: smoke

  clean:
    desc: Remove the built binary
    cmds:
      - rm -f {{.BINARY}}

  default:
    cmds:
      - task: verify
