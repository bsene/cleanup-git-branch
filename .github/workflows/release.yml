name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.26.1'

      - name: Verify entrypoint exists
        run: test -f cmd/cleanup-git-branch/main.go

      - name: Build
        run: go build ./cmd/cleanup-git-branch

      - name: Verify modules
        run: go mod verify

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.26.1'
          go-package: ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in \
            "linux amd64" "linux arm64" \
            "darwin amd64" "darwin arm64" \
            "windows amd64"; do
            set -- $target
            GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w" \
              -o "dist/cleanup-git-branch_$1_$2" ./cmd/cleanup-git-branch
          done
          mv dist/cleanup-git-branch_windows_amd64 dist/cleanup-git-branch_windows_amd64.exe

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          path: .
          output-file: dist/sbom.spdx.json
          format: spdx-json
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest-sbom@115c3be05ff3974bcbd596578934b3f9ce39bf68 # v2.2.0
        with:
          subject-path: dist/cleanup-git-branch_*
          sbom-path: dist/sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: dist/cleanup-git-branch_*

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*
          generate_release_notes: true
