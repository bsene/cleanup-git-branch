name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in \
            "linux amd64" "linux arm64" \
            "darwin amd64" "darwin arm64" \
            "windows amd64"; do
            set -- $target
            GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w" \
              -o "dist/cleanup-git-branch_$1_$2" ./cmd/cleanup-git-branch
          done
          mv dist/cleanup-git-branch_windows_amd64 dist/cleanup-git-branch_windows_amd64.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
